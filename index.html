<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我们的这一年</title>
  <style>
    :root {
      --paper: #fffbe7;
      --paper-title: #fbf6e0;
      --ink: #000;
      --soft-ink: rgba(47, 14, 14, 0.8);
      --red: #cb1515;
      --line: rgba(0, 0, 0, 0.05);
      --cell-w: 224px;
      --cell-h: 168px;
      --canvas-w: 1440px;
      --canvas-h: 900px;
      --stage-w: 1344px;
      --stage-h: 840px;
      --stage-scale: min(calc(100vw / 1440), calc(100vh / 900), 1);
    }

    @font-face {
      font-family: "ButterShisan";
      src: url("assets/fonts/黄油拾叁体.ttf") format("truetype");
      font-display: swap;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background: var(--paper);
      font-family: "ButterShisan", "Kaiti SC", "STKaiti", cursive, sans-serif;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    button { font: inherit; color: inherit; }

    .page {
      height: 100vh;
      width: 100%;
      min-width: 0;
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
      background: var(--paper);
      overflow: hidden;
    }

    .stage-shell {
      position: relative;
      flex: none;
      width: calc(var(--canvas-w) * var(--stage-scale));
      height: calc(var(--canvas-h) * var(--stage-scale));
    }

    .stage-canvas {
      position: relative;
      width: var(--canvas-w);
      height: var(--canvas-h);
      transform: scale(var(--stage-scale));
      transform-origin: top left;
    }

    .stage {
      position: absolute;
      left: 48px;
      top: 30px;
      width: var(--stage-w);
      height: var(--stage-h);
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      left: -48px;
      top: -30px;
      width: 1440px;
      height: 900px;
      background: url("assets/stickers/background.png") center / 100% 100% no-repeat;
      pointer-events: none;
      z-index: 0;
    }

    .memory-grid {
      position: absolute;
      left: 0;
      top: 0;
      width: 1344px;
      height: 840px;
      display: grid;
      grid-template-columns: repeat(6, var(--cell-w));
      grid-template-rows: repeat(5, var(--cell-h));
      border: 0.933px solid var(--line);
      background: var(--paper) url("assets/stickers/background.png") -48px -30px / 1440px 900px no-repeat;
      gap: 0;
      box-shadow: none;
      overflow: visible;
    }

    .cell {
      width: var(--cell-w);
      height: var(--cell-h);
      min-width: 0;
      min-height: 0;
      background: transparent;
      border: 0.933px solid var(--line);
      position: relative;
      overflow: visible;
    }

    .title-fill {
      background: transparent;
      pointer-events: none;
    }

    .desktop-paint {
      position: absolute;
      left: 507px;
      top: 169px;
      width: 445px;
      height: 335px;
      z-index: 18;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .desktop-paint img {
      width: 335px;
      height: 445px;
      object-fit: cover;
      opacity: 0.8;
      transform: rotate(-90deg);
      user-select: none;
      -webkit-user-drag: none;
    }

    .title-lockup {
      position: absolute;
      left: 429px;
      top: 282px;
      width: 370px;
      height: 156px;
      z-index: 20;
      pointer-events: none;
      color: var(--ink);
      text-transform: capitalize;
    }

    .title-happy,
    .title-anniversary,
    .title-sign,
    .title-ordinal,
    .title-suffix {
      position: absolute;
      z-index: 2;
      margin: 0;
      font-weight: 400;
      white-space: nowrap;
      letter-spacing: 0;
    }

    .title-tape {
      position: absolute;
      z-index: 1;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .title-tape-top {
      left: -99px;
      top: -40px;
      width: 472.5px;
      height: 141.75px;
      transform: rotate(6.7deg);
    }

    .title-tape-bottom {
      left: -34px;
      top: 78px;
      width: 450.9px;
      height: 135.27px;
      transform: rotate(5.19deg);
    }

    .title-happy {
      left: 0;
      top: -15.54px;
      font-size: 108.11px;
      line-height: 94.013px;
      clip-path: inset(-28px 100% -28px -28px);
      animation: writeHappy 900ms steps(6, end) 260ms forwards;
    }

    .title-anniversary {
      left: 0;
      top: 131.35px;
      font-size: 108.11px;
      line-height: 40.907px;
      clip-path: inset(-38px 100% -46px -28px);
      animation: writeAnniversary 1300ms steps(11, end) 1820ms forwards;
    }

    .title-sign {
      left: 42px;
      top: -65px;
      font-size: 30.833px;
      line-height: 17.531px;
    }


    .title-ordinal {
      left: 185px;
      top: -96px;
      color: var(--red);
      font-size: 333.128px;
      line-height: 333.128px;
      transform: rotate(-10.67deg);
      opacity: 0;
      animation: popTwo 520ms cubic-bezier(.2,1.3,.3,1) 1180ms forwards;
    }

    .title-suffix {
      left: 318px;
      top: -26px;
      color: var(--red);
      font-size: 72.872px;
      line-height: 72.872px;
      text-transform: lowercase;
      opacity: 0;
      animation: fadeIn 280ms ease 1400ms forwards;
    }

    .heart-img {
      position: absolute;
      left: 115px;
      top: 103px;
      width: 24.6px;
      height: 24.6px;
      object-fit: contain;
      z-index: 3;
      transform: scaleX(-1);
      opacity: 0;
      animation: heartBeatDesktop 900ms ease-in-out 3240ms infinite;
    }

    .title-sun {
      position: absolute;
      left: 182px;
      top: -70px;
      width: 28px;
      height: 28px;
      z-index: 3;
      object-fit: contain;
      animation: sunSpin 7s linear infinite;
      transform-origin: center center;
    }

    @keyframes writeHappy { to { clip-path: inset(-28px -64px -28px -28px); } }
    @keyframes writeAnniversary { to { clip-path: inset(-38px -80px -46px -28px); } }
    @keyframes popTwo { from { opacity: 0; transform: rotate(-10.67deg) scale(.72); } to { opacity: 1; transform: rotate(-10.67deg) scale(1); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes heartBeatDesktop {
      0%, 100% { opacity: 1; transform: scaleX(-1) scale(1); }
      45% { opacity: 1; transform: scaleX(-1) scale(1.2); }
    }
    @keyframes heartBeatMobile {
      0%, 100% { opacity: 1; transform: scaleX(-1) scale(1); }
      45% { opacity: 1; transform: scaleX(-1) scale(1.2); }
    }
    @keyframes sunSpin {
      0% { transform: rotate(0deg) translate(0, 0); }
      25% { transform: rotate(90deg) translate(0.7px, -0.4px); }
      50% { transform: rotate(180deg) translate(-0.5px, 0.6px); }
      75% { transform: rotate(270deg) translate(0.4px, 0.5px); }
      100% { transform: rotate(360deg) translate(0, 0); }
    }

    .memory-cell {
      padding: 0;
      cursor: pointer;
      perspective: 1400px;
      perspective-origin: center center;
      transform-style: preserve-3d;
      text-align: left;
      background: transparent;
      border: 0.933px solid var(--line);
      z-index: 2;
    }

    .memory-cell.open { z-index: 60; }

    .memory-cell:focus-visible {
      outline: 1.5px solid var(--red);
      outline-offset: -4px;
    }

    .cover {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: transparent;
      transform-origin: bottom center;
      transition: transform 300ms cubic-bezier(.2,.8,.2,1), opacity 220ms ease;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .memory-cell.open .cover {
      transform: rotateX(-179deg);
      opacity: 0;
      pointer-events: none;
    }

    .memory-cell.open-up .cover {
      transform-origin: top center;
    }

    .memory-cell.open-up.open .cover {
      transform: rotateX(179deg);
    }

    .place-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--soft-ink);
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .place {
      display: block;
      width: 100%;
      color: var(--soft-ink);
      font-size: 40px;
      line-height: 40px;
      letter-spacing: 0;
      font-weight: 400;
      white-space: nowrap;
    }

    .tagline {
      display: block;
      width: 100%;
      color: var(--soft-ink);
      font-size: 16px;
      line-height: 16px;
      letter-spacing: 0;
      white-space: nowrap;
      text-align: center;
    }

    .time {
      position: absolute;
      left: 7.07px;
      top: 7.07px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--red);
      font-size: 24px;
      line-height: 24px;
      transform: none;
      font-weight: 400;
      white-space: nowrap;
    }

    .opened-note {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      color: var(--soft-ink);
      font-size: 16px;
      line-height: 16px;
      text-align: center;
      opacity: 0;
      transition: opacity 220ms ease 260ms;
      pointer-events: none;
    }

    .memory-cell.open .opened-note,
    .mobile-card.open .opened-note {
      opacity: 1;
    }

    .unfold-strip {
      position: absolute;
      top: 100%;
      left: 0;
      height: calc(var(--stack-count) * 100%);
      width: calc(var(--row-count) * 100%);
      display: block;
      transform-style: preserve-3d;
      perspective: 1200px;
      pointer-events: none;
      z-index: 1;
      visibility: hidden;
      opacity: 0;
      transform-origin: left center;
      transform: translateZ(0);
      transition: opacity 120ms ease, visibility 0s linear 640ms;
    }

    .memory-cell.open .unfold-strip,
    .memory-cell.closing .unfold-strip {
      visibility: visible;
      opacity: 1;
      transition-delay: 0s;
    }

    .memory-cell.open-up .unfold-strip {
      top: auto;
      bottom: 100%;
    }

    .memory-cell.open-left .unfold-strip {
      left: auto;
      right: 0;
      transform-origin: right center;
    }

    .fold-panel {
      position: absolute;
      left: var(--panel-left);
      right: var(--panel-right);
      top: var(--panel-top);
      width: var(--cell-w);
      height: var(--cell-h);
      margin: 0;
      background: var(--paper);
      border: 0.933px solid var(--line);
      transition: transform 300ms cubic-bezier(.2,.8,.2,1), opacity 180ms ease, box-shadow 320ms ease;
      transition-delay: calc(225ms + var(--i) * 225ms);
      overflow: hidden;
      pointer-events: auto;
      opacity: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .fold-first {
      transform: rotateX(92deg);
      transform-origin: top center;
    }

    .memory-cell.open-up .fold-first {
      transform: rotateX(-92deg);
      transform-origin: bottom center;
    }

    .fold-side {
      transform: rotateY(-92deg);
      transform-origin: left center;
    }

    .memory-cell.open-left .fold-side {
      transform: rotateY(92deg);
      transform-origin: right center;
    }

    .memory-cell.open .fold-panel {
      transform: rotateX(0deg) rotateY(0deg);
      opacity: 1;
      box-shadow: 4px 0 10px rgba(0, 0, 0, 0.06);
    }

    .memory-cell.closing .fold-panel {
      transition-delay: calc((var(--count) - 1 - var(--i)) * 225ms);
    }

    .memory-cell.closing .cover {
      transition-delay: calc(var(--count) * 225ms);
    }

    .fold-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      box-shadow: inset 0 0 0 10px #fff;
      background: linear-gradient(90deg, rgba(0, 0, 0, 0.08), transparent 12%, transparent 88%, rgba(0, 0, 0, 0.04));
      mix-blend-mode: multiply;
      opacity: 0.38;
    }

    .fold-panel::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 1px;
      background: rgba(0, 0, 0, 0.12);
    }

    .memory-cell.open-left .fold-panel::after {
      left: auto;
      right: 0;
    }

    .fold-up {
      transform: rotateX(-92deg);
      transform-origin: bottom center;
    }

    .memory-cell.open .fold-up {
      transform: rotateX(0deg);
    }

    .fold-panel img.photo-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      filter: saturate(0.96) contrast(1.02);
      user-select: none;
      -webkit-user-drag: none;
    }

    .paper-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 3;
      width: 310px;
      height: 310px;
      object-fit: contain;
      transform: translate(-50%, calc(-50% - 20px));
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .empty-cell {
      background: transparent;
      pointer-events: none;
    }

    .memory-cell .place-wrap {
      left: 50%;
      width: 100%;
      align-items: center;
      text-align: center;
    }

    .memory-cell .place,
    .memory-cell .tagline {
      width: 100%;
      text-align: center;
    }

    .letter-cell {
      padding: 0;
      border: 0.933px solid var(--line);
      background: transparent;
      cursor: pointer;
      overflow: visible;
      z-index: 5;
    }

    .letter-closed,
    .letter-scroll,
    .letter-paper2,
    .letter-envelope,
    .letter-open-overlay {
      position: absolute;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .letter-closed {
      inset: 0;
      z-index: 2;
      transition: transform 220ms ease;
      transform-origin: center center;
    }

    .letter-cell::after,
    .mobile-letter::after {
      content: "open it";
      position: absolute;
      color: var(--soft-ink);
      font-size: 48px;
      line-height: 48px;
      pointer-events: none;
      z-index: 6;
    }

    .letter-cell::after {
      left: 50%;
      bottom: 16px;
      opacity: 0;
      transform: translateX(-50%);
      white-space: nowrap;
      width: max-content;
      min-width: 150px;
      transition: opacity 180ms ease;
    }

    .letter-cell:hover::after {
      opacity: 1;
    }

    .letter-cell.open::after,
    .mobile-letter.open::after {
      opacity: 0;
    }

    .letter-cell:not(.open):hover .letter-closed {
      transform: scale(1.2);
    }

    .letter-paper2 {
      left: 45px;
      top: -44px;
      width: 203px;
      height: 203px;
      object-fit: cover;
    }

    .letter-envelope {
      left: 0;
      top: 15px;
      width: 166px;
      height: 96px;
      object-fit: contain;
      transform: rotate(-14.95deg);
      transform-origin: center center;
    }

    .letter-open-overlay {
      left: -11px;
      top: -50px;
      width: 180px;
      height: 180px;
      object-fit: contain;
      opacity: 0;
      transition: opacity 160ms ease 0ms;
    }

    .letter-cell.open .letter-open-overlay {
      opacity: 1;
    }

    .letter-scroll {
      left: 0;
      bottom: 100%;
      width: 100%;
      height: 0;
      border: 0.933px solid var(--line);
      background: #fffdf0;
      overflow: hidden;
      box-shadow: 0 -10px 22px rgba(0, 0, 0, 0.06);
      transition: height 760ms cubic-bezier(.2,.8,.2,1) 180ms;
    }

    .letter-cell.open .letter-scroll {
      height: calc(var(--cell-h) * 3);
    }

    .letter-scroll::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -8px;
      height: 16px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.08);
      filter: blur(3px);
    }

    .letter-text {
      position: absolute;
      inset: 24px 22px;
      margin: 0;
      color: var(--soft-ink);
      font-size: 20px;
      line-height: 1.65;
      text-align: center;
      white-space: pre-line;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hint { display: none; }

    .mobile-page {
      display: none;
    }

    .mobile-title {
      position: relative;
      height: 844px;
      margin: 0;
      text-align: center;
      overflow: hidden;
    }

    .mobile-paint {
      position: absolute;
      left: -52px;
      top: 0;
      width: 475px;
      height: 633px;
      z-index: 0;
      object-fit: cover;
      opacity: 0;
      animation: mobilePaintFade 500ms ease-out forwards;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .mobile-title .title-tape {
      width: 381.333px;
      height: 114.4px;
      opacity: 0;
      z-index: 1;
      animation: gravityDrop 800ms cubic-bezier(.18,.89,.28,1.12) 500ms forwards;
    }

    .mobile-title .title-tape-top {
      left: 50%;
      top: 133px;
      transform: translateX(calc(-50% - 48px));
    }

    .mobile-title .title-tape-bottom {
      left: 50%;
      top: 212px;
      transform: translateX(calc(-50% - 7px));
    }

    .mobile-title-text {
      position: absolute;
      left: 50%;
      top: 147px;
      width: 332px;
      z-index: 2;
      transform: translateX(calc(-50% + 24px));
      text-transform: capitalize;
      text-align: left;
      opacity: 0;
      animation: gravityDrop 800ms cubic-bezier(.18,.89,.28,1.12) 500ms forwards;
    }

    .mobile-title-line {
      display: block;
      height: 78px;
      white-space: nowrap;
    }

    .mobile-title-happy,
    .mobile-title-anniversary {
      display: inline-block;
      font-size: 83.566px;
      line-height: 72.67px;
      clip-path: inset(-24px 100% -28px -20px);
    }

    .mobile-title-happy {
      clip-path: inset(-24px -40px -28px -20px);
      animation: none;
    }

    .mobile-title-anniversary {
      display: block;
      margin-top: 6px;
      clip-path: inset(-24px -60px -28px -20px);
      animation: none;
    }

    .mobile-title-two {
      color: var(--red);
      font-size: 176px;
      line-height: 0;
      display: inline-block;
      opacity: 1;
      transform: rotate(-10.67deg) translate(-10px, 27px);
      animation: none;
    }

    .mobile-title-suffix {
      color: var(--red);
      font-size: 38px;
      vertical-align: top;
      margin-left: -30px;
      position: relative;
      top: 10px;
      opacity: 1;
      animation: none;
    }

    .mobile-title-sign {
      position: absolute;
      left: 85px;
      top: 506px;
      z-index: 2;
      margin: 0;
      font-size: 32px;
      line-height: 13.551px;
      opacity: 0;
      animation: gravityDrop 800ms cubic-bezier(.18,.89,.28,1.12) 1050ms forwards;
    }

    .mobile-title-sun {
      position: absolute;
      left: 230px;
      top: 503px;
      width: 20px;
      height: 20px;
      z-index: 2;
      opacity: 0;
      animation: gravityDrop 800ms cubic-bezier(.18,.89,.28,1.12) 1050ms forwards, sunSpin 7s linear 1050ms infinite;
      transform-origin: center center;
    }

    .mobile-heart-img {
      position: absolute;
      left: calc(50% - 33px);
      top: 238px;
      width: 18px;
      height: 18px;
      z-index: 3;
      transform: scaleX(-1);
      opacity: 0;
      animation: gravityDrop 800ms cubic-bezier(.18,.89,.28,1.12) 500ms forwards, heartBeatMobile 900ms ease-in-out 1050ms infinite;
    }

    @keyframes gravityDrop {
      0% { opacity: 0; translate: 0 -72px; }
      76% { opacity: 1; translate: 0 6px; }
      100% { opacity: 1; translate: 0 0; }
    }

    @keyframes mobilePaintFade { to { opacity: 1; } }
    @keyframes mobileWriteHappy { to { clip-path: inset(-24px -40px -28px -20px); } }
    @keyframes mobileWriteAnniversary { to { clip-path: inset(-24px -60px -28px -20px); } }
    @keyframes mobilePopTwo {
      from { opacity: 0; transform: rotate(-10.67deg) translate(-10px, 27px) scale(.72); }
      to { opacity: 1; transform: rotate(-10.67deg) translate(-10px, 27px) scale(1); }
    }

    .mobile-board {
      --mobile-gap: 10px;
      --mobile-cell-size: calc((min(100vw, 430px) - 24px - var(--mobile-gap)) / 2);
      display: grid;
      grid-template-columns: repeat(2, var(--mobile-cell-size));
      grid-auto-rows: var(--mobile-cell-size);
      gap: var(--mobile-gap);
      position: relative;
    }

    .mobile-card {
      position: relative;
      width: var(--mobile-cell-size);
      height: var(--mobile-cell-size);
      padding: 0;
      border: 0.933px solid var(--line);
      background: rgba(255, 251, 231, 0.18);
      cursor: pointer;
      text-align: left;
      overflow: visible;
      perspective: 1200px;
      z-index: 1;
    }

    .mobile-card.open,
    .mobile-card.closing {
      z-index: 40;
    }

    .mobile-card .opened-note {
      font-size: 14px;
      line-height: 14px;
      z-index: 1;
    }

    .mobile-fold-map {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--mobile-cell-size);
      height: var(--mobile-cell-size);
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .mobile-card-cover {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--mobile-cell-size);
      height: var(--mobile-cell-size);
      z-index: 3;
      background: transparent;
      transform-origin: right center;
      transition: transform 300ms cubic-bezier(.2,.8,.2,1);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

      height: var(--mobile-cell-size);
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      border: 0.933px solid var(--line);
      pointer-events: none;
      opacity: 0;
      transform: var(--mobile-start-transform);
      transform-origin: var(--mobile-origin);
      transition: transform 300ms cubic-bezier(.2,.8,.2,1), opacity 180ms ease;
      transition-delay: calc(225ms + var(--i) * 225ms);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .mobile-card.open .mobile-photo {
      opacity: 1;
      transform: rotateX(0deg) rotateY(0deg);
    }

    .mobile-card.closing .mobile-photo {
      transition-delay: calc((var(--count) - 1 - var(--i)) * 225ms);
    }

    .mobile-card.closing .mobile-card-cover {
      transition-delay: calc(var(--count) * 225ms);
    }

        left: 0;
        right: 0;

        pointer-events: none;
        z-index: 100;

      }

      .mobile-board {
        display: none;
      }

      /* 使用更高优先级的选择器，确保 journey-active 状态下 visible 正确显示 */
      .mobile-page.journey-active .mobile-board.visible {
        display: grid;
        animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      .mobile-paint {
        left: 50%;
        top: 0;
        width: min(100%, 390px);
        height: auto;
        aspect-ratio: 390 / 633;
        object-fit: contain;
        transform: translateX(-50%);

        text-align: center;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

    function renderTitleFill(row, col, span) {
      const cell = document.createElement('div');

    function renderTrip(trip, index) {
      const slot = contentSlots[index];
      const pagePhotos = trip.photos.slice(0, 5);
      const rowCount = Math.min(pagePhotos.length, 3);
      const stackCount = Math.max(1, pagePhotos.length - 2);
      const opensUp = slot[0] >= 5;
      const opensLeft = slot[1] + rowCount - 1 > 6;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'cell memory-cell' + (opensLeft ? ' open-left' : '') + (opensUp ? ' open-up' : '');
      button.style.gridRow = slot[0];
      button.style.gridColumn = slot[1];
      button.style.setProperty('--count', pagePhotos.length);
      button.style.setProperty('--row-count', rowCount);
      button.style.setProperty('--stack-count', stackCount);
      button.setAttribute('aria-label', trip.place + ' ' + trip.time + '，点击打开照片');

      const panels = pagePhotos.map((file, photoIndex) => {
        const isFirst = photoIndex === 0;
        const isStackedUp = photoIndex >= 3;
        const foldClass = isFirst ? 'fold-panel fold-first' : (isStackedUp ? 'fold-panel fold-up' : 'fold-panel fold-side');
        const x = Math.min(photoIndex, 2);
        const y = photoIndex >= 3 ? -(photoIndex - 2) : 0;
        const sideOffset = 'calc(' + x + ' * var(--cell-w))';
        const horizontal = opensLeft ? 'right:' + sideOffset + '; --panel-left:auto; --panel-right:' + sideOffset + ';' : 'left:' + sideOffset + '; --panel-left:' + sideOffset + '; --panel-right:auto;';

        { x: -1, y: 0, origin: "right center", transform: "rotateY(-92deg)" },
        { x: -1, y: 1, origin: "top center", transform: "rotateX(92deg)" },
        { x: 0, y: 1, origin: "left center", transform: "rotateY(92deg)" },
        { x: 0, y: 2, origin: "top center", transform: "rotateX(92deg)" },
        { x: -1, y: 2, origin: "right center", transform: "rotateY(-92deg)" }
      ];
      const steps = opensLeft ? leftFirst : rightFirst;
      return steps[photoIndex] || steps[steps.length - 1];
    }

    function closeFoldCell(cell, baseClass) {
      if (!cell || cell.classList.contains('closing')) return;
      const count = Number(cell.style.getPropertyValue('--count')) || 1;
      const closeMs = 300 + count * 225 + 80;
      cell.classList.add('closing');
      cell.classList.remove('open');
      window.setTimeout(() => {
        cell.classList.remove('closing');
      }, closeMs);
    }

    function renderMobileTrip(trip, index) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "mobile-card" + (index % 2 === 1 ? " open-left" : "");
      card.setAttribute("aria-label", trip.place + " " + trip.time + "，点击打开照片");
      const pagePhotos = trip.photos.slice(0, 5);
      card.style.setProperty("--count", pagePhotos.length);
      const opensLeft = index % 2 === 1;
      const photos = pagePhotos.map((file, photoIndex) => {
        const step = mobileFoldStep(photoIndex, opensLeft);
        const left = 'calc((' + step.x + ') * (var(--mobile-cell-size) + var(--mobile-gap)))';
        const top = 'calc((' + step.y + ') * (var(--mobile-cell-size) + var(--mobile-gap)))';
        return '<figure class="mobile-photo" style="--i:' + photoIndex + '; --mobile-left:' + left + '; --mobile-top:' + top + '; --mobile-origin:' + step.origin + '; --mobile-start-transform:' + step.transform + ';"><img class="photo-img" src="' + photoPath(trip, file) + '" alt="' + trip.place + ' ' + trip.time + ' 照片 ' + (photoIndex + 1) + '" loading="lazy"><img class="paper-frame" src="assets/stickers/paper.png" alt="" aria-hidden="true"></figure>';
      }).join("");
      card.innerHTML =
        '<div class="opened-note">' + openCaptions[index] + '</div>' +
        '<div class="mobile-fold-map">' +
          '<div class="mobile-card-cover">' +
            '<span class="time">' + trip.time + '</span>' +
            '<span class="place-wrap">' +
              '<span class="place">' + trip.place + '</span>' +
              '<span class="tagline">“' + trip.note + '”</span>' +
            '</span>' +
          '</div>' +
          photos +
        '</div>';
      card.addEventListener("click", () => {
        const wasOpen = card.classList.contains("open");
        document.querySelectorAll(".mobile-card.open").forEach((item) => {
          if (item !== card) closeFoldCell(item, "mobile-card");
        });
        if (wasOpen) {
          closeFoldCell(card, "mobile-card");
        } else {
          card.classList.remove("closing");
          card.classList.add("open");
        }
      });
      return card;
    }

    function renderMobileLetter() {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "mobile-letter";
      button.setAttribute("aria-label", "打开一封信");
      button.innerHTML = '<div class="letter-closed"><img class="letter-paper2" src="assets/stickers/paper2.png" alt="" aria-hidden="true"><img class="letter-envelope" src="assets/stickers/letter.png" alt="" aria-hidden="true"><img class="letter-open-overlay" src="assets/stickers/letteropen.png" alt="" aria-hidden="true"></div><p class="mobile-letter-copy">' + letterCopy + '</p>';
      button.addEventListener("click", () => {
        const willOpen = !button.classList.contains("open");
        button.classList.toggle("open", willOpen);
        if (willOpen) {
          window.setTimeout(() => {
            const mobileBoard = document.getElementById("mobileBoard");
            if (mobileBoard) {
              mobileBoard.scrollTo({ top: mobileBoard.scrollHeight, behavior: "smooth" });
            }
            button.scrollIntoView({ block: "end", behavior: "smooth" });
          }, 80);
        }
      });
      return button;
    }

    function renderMobileBoard() {
      const mobileBoard = document.getElementById("mobileBoard");
      if (!mobileBoard) return;
      trips.forEach((trip, index) => mobileBoard.appendChild(renderMobileTrip(trip, index)));
      mobileBoard.appendChild(renderMobileLetter());
    }

    function renderLetterCell() {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'cell letter-cell';
      button.style.gridRow = 5;
      button.style.gridColumn = 6;
      button.setAttribute('aria-label', '打开一封信');
      button.innerHTML = '<div class="letter-scroll"><p class="letter-text">' + letterCopy + '</p></div><div class="letter-closed"><img class="letter-paper2" src="assets/stickers/paper2.png" alt="" aria-hidden="true"><img class="letter-envelope" src="assets/stickers/letter.png" alt="" aria-hidden="true"><img class="letter-open-overlay" src="assets/stickers/letteropen.png" alt="" aria-hidden="true"></div>';
      button.addEventListener('click', () => {
        button.classList.toggle('open');
      });
      grid.appendChild(button);
    }

    titleFills.forEach(([row, col, span]) => renderTitleFill(row, col, span));
    trips.forEach(renderTrip);
    emptyCells.forEach(([row, col]) => renderEmpty(row, col));
    renderLetterCell();
    function initMobileJourney() {
      const wrapper = document.querySelector('.mobile-view-journey-wrapper');
      const mobilePage = document.querySelector('.mobile-page');
      const board = document.getElementById('mobileBoard');
      const mobileTitle = document.querySelector('.mobile-title');

      if (!wrapper || !mobilePage || !board) return;

      // 点击 view the journey 或 arrow：标题上移，格子从标题下方 48px 处独立滚动
      wrapper.addEventListener('click', (e) => {
        e.stopPropagation(); // 阻止冒泡，避免触发 mobile-title 的点击收起逻辑
        mobilePage.classList.add('journey-active');
        board.classList.add('visible');
        // 平滑滚动到标题上移后的可视区域
        board.scrollTop = 0;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      const returnToCover = () => {
        mobilePage.classList.remove('journey-active');
        board.classList.remove('visible');
        board.scrollTop = 0;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      let pullStartY = 0;
      let isPullingFromTop = false;

      board.addEventListener('touchstart', (event) => {
        if (!mobilePage.classList.contains('journey-active')) return;
        pullStartY = event.touches[0].clientY;
        isPullingFromTop = board.scrollTop <= 0;
      }, { passive: true });

      board.addEventListener('touchmove', (event) => {
        if (!mobilePage.classList.contains('journey-active') || !isPullingFromTop) return;
        const pullDistance = event.touches[0].clientY - pullStartY;
        if (pullDistance > 86) {
          isPullingFromTop = false;
          returnToCover();
        }
      }, { passive: true });
    }

    renderMobileBoard();
    initMobileJourney();
  </script>
</body>
</html>
